version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Releases younger than a week are where supply-chain attacks hide: wait before proposing them.
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      tooling:
        dependency-type: development
    ignore:
      # typescript-eslint supports TypeScript < 6.1; TypeScript 7 (native compiler) breaks type-aware linting.
      - dependency-name: typescript
        versions: ['>=6.1.0']
      # Types must match the lowest supported runtime (Node.js 24, see .nvmrc).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
